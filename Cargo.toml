[package]
name = "genbit"
version = "0.8.1"
edition = "2024"
rust-version = "1.98.1"
description = "A small static site generator"
license = "MIT"
repository = "https://github.com/nnenn0/genbit"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
http = "1"
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
kamadak-exif = "0.6"
minify-html = "0.18"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tempfile = "3"
tera = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
tower-http = { version = "0.7", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
