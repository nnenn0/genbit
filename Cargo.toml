[package]
name = "genbit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A small static site generator"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

gray_matter = { version = "0.3", default-features = false, features = ["toml"] }
minify-html = "0.18"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tera = "2"
toml = "1"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
