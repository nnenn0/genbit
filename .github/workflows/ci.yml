name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.98.1

      - name: Check formatting
        run: cargo +1.98.1 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.98.1 clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +1.98.1 test --locked --all-targets --all-features
