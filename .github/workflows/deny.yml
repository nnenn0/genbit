name: Dependencies

# 依存の変更は PR で検査する。脆弱性の勧告は依存を変えなくても後から出るため、週 1 回も検査する。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ジョブ名は必須チェックの名前になるため、matrix の検査項目から作らず固定の名前を付ける。
  # 勧告は依存を変えなくても後から出るため、無関係な PR を止めないよう deny-advisories は
  # 必須チェックにしない。依存の方針に関わる deny-policy だけを必須にする。
  cargo-deny:
    name: deny-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: advisories
            checks: advisories
          - name: policy
            checks: bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
