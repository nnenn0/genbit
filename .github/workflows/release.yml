name: Release

# v* タグはルールセットで削除も付け替えもできないため、ワークフローではタグを作らない。
# 下書きの Release だけを作り、タグは下書きを公開したときに GitHub が作る。
on:
  workflow_dispatch:

permissions:
  contents: read

# 同時に実行すると、両方が既存の下書きの確認を通って同じ版の下書きを2つ作るため、順に実行する。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Determine release tag
        id: tag
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the release workflow on main, not $GITHUB_REF"
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists. Bump the version in Cargo.toml first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  # about.toml で配布ターゲットを指定しているため、生成結果は実行する OS によらない。
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-about@0.9.2

      - name: Generate third-party licenses
        run: scripts/third-party-licenses.sh THIRD_PARTY_LICENSES.md

      # artifact はジョブ間の受け渡しにだけ使う。配布物は Release に添付する。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error
          retention-days: 1

  build:
    needs: licenses
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Check static linking
        if: endsWith(matrix.target, '-linux-musl')
        run: file "target/$TARGET/release/genbit" | grep -E 'statically linked|static-pie linked'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses

      # artifact はファイルの実行権限を保持しないため、ビルドしたランナーでアーカイブにする。
      - name: Package binary
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          name="genbit-v$version-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/genbit" LICENSE README.md THIRD_PARTY_LICENSES.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # 利用者が受け取るアーカイブを展開して確かめる。
      - name: Smoke test archive
        run: |
          mkdir "$RUNNER_TEMP/archive"
          tar -xzf "$ARCHIVE.tar.gz" -C "$RUNNER_TEMP/archive"
          scripts/smoke-test.sh "$RUNNER_TEMP/archive/$ARCHIVE/genbit" "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genbit-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # 下書きはタグを持たないため、prepare のタグの確認では同じ版の下書きを見つけられない。
      - name: Check no release exists for the tag
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Delete the draft or bump the version."
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: genbit-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: |
          test "$(find . -name "genbit-$RELEASE_TAG-*.tar.gz" | wc -l)" -eq 2
          sha256sum genbit-*.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/genbit-*.tar.gz

      - name: Create draft release
        run: |
          gh release create "$RELEASE_TAG" release/genbit-*.tar.gz release/SHA256SUMS \
            --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
