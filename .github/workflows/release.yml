name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Check tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$RELEASE_TAG" = "v$version"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  # 依存クレートの著作権表示とソースの入手先を、配布アーカイブに同梱する。
  # about.toml で配布ターゲットを指定しているため、生成結果は実行する OS によらない。
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-about@0.9.2

      - name: Generate third-party licenses
        run: scripts/third-party-licenses.sh THIRD_PARTY_LICENSES.md

      # artifact はジョブ間の受け渡しにだけ使う。配布物は Release に添付する。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error
          retention-days: 1

  # verify と並列に動かす。下書き Release は release ジョブが全ジョブの成功を待ってから作る。
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Check static linking
        if: endsWith(matrix.target, '-linux-musl')
        run: file "target/$TARGET/release/genbit" | grep -E 'statically linked|static-pie linked'

      - name: Smoke test binary
        run: scripts/smoke-test.sh "target/$TARGET/release/genbit" "${RELEASE_TAG#v}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genbit-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/genbit
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [verify, licenses, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: genbit-*
          path: bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses

      # artifact はファイルの実行権限を保持しないため、アーカイブに入れる前に付け直す。
      - name: Package binaries
        run: |
          mkdir -p dist release
          for dir in bin/genbit-*; do
            target=${dir#bin/genbit-}
            name="genbit-$RELEASE_TAG-$target"
            mkdir "dist/$name"
            cp "$dir/genbit" LICENSE README.md THIRD_PARTY_LICENSES.md "dist/$name/"
            chmod +x "dist/$name/genbit"
            tar -C dist -czf "release/$name.tar.gz" "$name"
          done
          test "$(find release -name 'genbit-*.tar.gz' | wc -l)" -eq 2

      - name: Create checksums
        working-directory: release
        run: sha256sum genbit-*.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/genbit-*.tar.gz

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release/genbit-*.tar.gz release/SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
