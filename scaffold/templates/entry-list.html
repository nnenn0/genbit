<ul class="unmarked-list">
  {% for entry in entries %}
  <li><a href="{{ entry.url }}">{{ entry.title }}</a><span class="entry-meta"><time datetime="{{ entry.created_at.datetime }}">{{ entry.created_at.date }}</time>{% if entry.draft %}<span class="draft-badge">draft</span>{% endif %}</span></li>
  {% endfor %}
</ul>
