<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png" sizes="80x80">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/feed.xml">
  <title>{% block title %}{{ article.title }} | {{ site.title }}{% endblock title %}</title>
  {% block metadata %}
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:title" content="{% block og_title %}{{ article.title }} | {{ site.title }}{% endblock og_title %}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="{% block og_type %}article{% endblock og_type %}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ site.og_image }}">
  <meta property="og:image:alt" content="{{ site.title }}">
  <script type="application/ld+json">{{ json_ld | safe }}</script>
  {% endblock metadata %}
  <style>{{ css | safe }}</style>
</head>
<body>
  <header>{% block header %}<a href="/">{{ site.title }}</a>{% endblock header %}</header>
  <main>{% block main %}{% endblock main %}</main>
</body>
</html>
