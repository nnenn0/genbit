{% extends "base.html" %}
{% block main %}
<article>
  <h1>{{ page.title }}</h1>
  {{ content | safe }}
  {% if page.url == "/" %}
  <ul class="post-list">
    {% for entry in pages %}
    <li><time datetime="{{ entry.created_at }}">{{ entry.created_at }}</time> <a href="{{ entry.url }}">{{ entry.title }}</a></li>
    {% endfor %}
  </ul>
  {% endif %}
</article>
{% endblock main %}
