{% extends "base.html" %}
{% block main %}
<article>
  <h1><a class="heading-anchor" href="{{ article.url }}">{{ article.title }}</a></h1>
  <dl class="article-meta">
    <dt>created_at</dt>
    <dd><time datetime="{{ article.created_at }}">{{ article.created_at }}</time></dd>
    <dt>updated_at</dt>
    <dd><time datetime="{{ article.updated_at }}">{{ article.updated_at }}</time></dd>
    <dt>tags</dt>
    <dd>{% for tag in article.tags %}<a href="/tags/{{ tag }}/">{{ tag }}</a>{% endfor %}</dd>
  </dl>
  {{ content | safe }}
</article>
{% endblock main %}
